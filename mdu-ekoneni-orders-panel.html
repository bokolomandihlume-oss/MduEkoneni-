<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MDU Ekoneni — Orders</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Anton&family=Work+Sans:wght@400;500;600;700;800&display=swap');

  :root {
    --bg: #0d0d0d;
    --card: #171717;
    --cream: #f4ece0;
    --ember: #e8721c;
    --ember-dark: #c25412;
    --gold: #f0b429;
    --green: #3fb27f;
    --red: #e5484d;
    --line: rgba(244,236,224,0.10);
    --muted: rgba(244,236,224,0.55);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--cream);
    font-family: 'Work Sans', sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }

  .wrap { max-width: 520px; margin: 0 auto; padding: 20px 16px 60px; }

  header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 18px;
  }

  header h1 {
    font-family: 'Anton', sans-serif; font-weight: 400; font-size: 24px; margin: 0;
    color: var(--cream);
  }
  header h1 span { color: var(--ember); }

  .live-dot {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 11px; font-weight: 700; color: var(--muted);
    border: 1px solid var(--line); border-radius: 20px; padding: 5px 10px;
  }
  .live-dot::before {
    content: ''; width: 7px; height: 7px; border-radius: 50%;
    background: var(--green); box-shadow: 0 0 0 0 rgba(63,178,127,0.6);
    animation: pulse 1.8s infinite;
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(63,178,127,0.5); }
    70% { box-shadow: 0 0 0 6px rgba(63,178,127,0); }
    100% { box-shadow: 0 0 0 0 rgba(63,178,127,0); }
  }

  /* ---- Admin login screen ---- */
  .login-screen {
    min-height: 90vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center; gap: 12px;
    padding: 20px;
  }
  .login-screen h2 { font-family: 'Anton', sans-serif; font-weight: 400; font-size: 22px; margin: 0; }
  .login-screen p { color: var(--muted); font-size: 13px; margin: 0 0 6px; max-width: 300px; }
  .login-input {
    width: min(320px, 90vw); padding: 12px 14px; border-radius: 10px;
    border: 1.5px solid var(--line); background: var(--card); color: var(--cream);
    font-size: 15px;
  }
  .login-input:focus { outline: none; border-color: var(--ember); }
  .login-error { color: var(--red); font-size: 12.5px; min-height: 16px; max-width: 320px; }
  .login-btn {
    background: var(--ember); color: #1a1408; border: none; border-radius: 20px;
    padding: 10px 30px; font-weight: 800; font-size: 14px; cursor: pointer;
  }
  .login-btn:disabled { opacity: .6; cursor: wait; }
  .admin-tools { display:flex; align-items:center; gap:8px; }
  .logout-btn {
    background: none; border: 1px solid var(--line); color: var(--muted);
    font-size: 11px; padding: 6px 10px; border-radius: 20px; cursor: pointer;
  }

  /* ---- Section headers ---- */
  .section-title {
    font-size: 12px; font-weight: 700; color: var(--muted);
    margin: 22px 0 10px; letter-spacing: 0.3px;
  }
  .section-title .count {
    background: var(--ember); color: #1a1408; border-radius: 12px;
    padding: 1px 8px; font-size: 11px; margin-left: 6px;
  }

  .empty-state {
    text-align: center; color: var(--muted); font-size: 13px;
    padding: 30px 10px; border: 1px dashed var(--line); border-radius: 14px;
  }

  /* ---- Order cards ---- */
  .order-card {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 14px 16px; margin-bottom: 12px;
  }
  .order-card.pending { border-color: var(--ember); }

  .order-top {
    display: flex; justify-content: space-between; align-items: flex-start; gap: 10px;
    margin-bottom: 8px;
  }
  .order-name { font-weight: 800; font-size: 15px; color: var(--cream); }
  .order-time { font-size: 11.5px; color: var(--muted); margin-top: 2px; }
  .order-type-pill {
    font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 20px;
    background: rgba(232,114,28,0.15); color: var(--ember); white-space: nowrap;
  }

  .order-lines { font-size: 13.5px; color: var(--cream); line-height: 1.5; margin: 8px 0; }
  .order-lines .line { display: flex; justify-content: space-between; }
  .order-lines .line span:last-child { color: var(--muted); }

  .order-address { font-size: 12.5px; color: var(--muted); margin-bottom: 8px; }

  .order-total {
    display: flex; justify-content: space-between; align-items: center;
    font-weight: 800; font-size: 15px; color: var(--gold);
    border-top: 1px solid var(--line); padding-top: 8px; margin-top: 4px;
  }

  .order-actions { display: flex; gap: 10px; margin-top: 12px; }
  .btn-accept, .btn-reject {
    flex: 1; border: none; border-radius: 12px; padding: 11px; font-weight: 800;
    font-size: 13.5px; cursor: pointer;
  }
  .btn-accept { background: var(--green); color: #05261a; }
  .btn-reject { background: rgba(229,72,77,0.15); color: var(--red); border: 1.5px solid var(--red); }

  .status-pill {
    font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 20px;
    white-space: nowrap;
  }
  .status-pill.confirmed { background: rgba(63,178,127,0.15); color: var(--green); }
  .status-pill.rejected { background: rgba(229,72,77,0.15); color: var(--red); }

  .loading-text { text-align: center; color: var(--muted); font-size: 13px; padding: 20px; }
</style>
</head>
<body>

<div class="wrap" id="app">
  <div class="login-screen" id="loginScreen">
    <h2>MDU Ekoneni — Admin</h2>
    <p>Sign in with the owner's admin email and password to view and manage orders.</p>
    <input type="email" autocomplete="username" class="login-input" id="adminEmail" placeholder="Admin email">
    <input type="password" autocomplete="current-password" class="login-input" id="adminPassword" placeholder="Password">
    <div class="login-error" id="loginError"></div>
    <button class="login-btn" id="loginBtn" onclick="loginAdmin()">Sign in</button>
  </div>

  <div id="dashboard" style="display:none;">
    <header>
      <h1>MDU<span>.</span> Orders</h1>
      <div class="admin-tools">
        <span class="live-dot">Live</span>
        <button class="logout-btn" onclick="logoutAdmin()">Log out</button>
      </div>
    </header>

    <div class="section-title">New orders <span class="count" id="pendingCount">0</span></div>
    <div id="pendingList"><div class="loading-text">Loading…</div></div>

    <div class="section-title">Recent activity</div>
    <div id="historyList"></div>
  </div>
</div>

<script>
  const SUPABASE_URL = "https://mgbufaizsyykhltidlxv.supabase.co";
  const SUPABASE_KEY = "sb_publishable_W7B4hcwatX5Pmf6mqBeyMw_mq6WHgKP";
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  let realtimeChannel = null;

  async function loginAdmin() {
    const email = document.getElementById('adminEmail').value.trim();
    const password = document.getElementById('adminPassword').value;
    const errorEl = document.getElementById('loginError');
    const btn = document.getElementById('loginBtn');
    errorEl.textContent = '';

    if (!email || !password) {
      errorEl.textContent = 'Enter your admin email and password.';
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Signing in…';

    const { error } = await sb.auth.signInWithPassword({ email, password });
    if (error) {
      errorEl.textContent = 'Incorrect email or password.';
      btn.disabled = false;
      btn.textContent = 'Sign in';
      return;
    }

    btn.disabled = false;
    btn.textContent = 'Sign in';
    showDashboard();
  }

  document.getElementById('adminPassword').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') loginAdmin();
  });

  function showDashboard() {
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    loadOrders();
    subscribeRealtime();
  }

  async function logoutAdmin() {
    if (realtimeChannel) {
      await sb.removeChannel(realtimeChannel);
      realtimeChannel = null;
    }
    await sb.auth.signOut();
    document.getElementById('dashboard').style.display = 'none';
    document.getElementById('loginScreen').style.display = 'flex';
    document.getElementById('adminPassword').value = '';
  }

  sb.auth.getSession().then(({ data }) => {
    if (data.session) showDashboard();
  });

  let pending = [];
  let history = [];

  async function loadOrders() {
    try {
      const { data, error } = await sb
        .from('orders')
        .select('*')
        .order('created_at', { ascending: true });
      if (error) throw error;

      pending = (data || []).filter(o => o.status === 'pending');
      history = (data || [])
        .filter(o => o.status === 'confirmed' || o.status === 'rejected')
        .sort((a, b) => new Date(b.created_at) - new Date(a.created_at))
        .slice(0, 15);

      renderPending();
      renderHistory();
    } catch (err) {
      document.getElementById('pendingList').innerHTML =
        `<div class="empty-state">Couldn't load orders. Pull to refresh or check your connection.</div>`;
    }
  }

  function subscribeRealtime() {
    if (realtimeChannel) sb.removeChannel(realtimeChannel);
    realtimeChannel = sb.channel('orders-admin-feed')
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'orders' }, (payload) => {
        if (payload.new.status === 'pending') {
          pending.push(payload.new);
          renderPending();
        }
      })
      .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'orders' }, (payload) => {
        pending = pending.filter(o => o.id !== payload.new.id);
        if (payload.new.status === 'pending') {
          pending.push(payload.new);
        } else {
          history.unshift(payload.new);
          history = history.slice(0, 15);
        }
        renderPending();
        renderHistory();
      })
      .subscribe();
  }

  function fmtTime(ts) {
    return new Date(ts).toLocaleString('en-ZA', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
  }

  function orderLinesHTML(order) {
    return (order.items || []).map(i => `
      <div class="line"><span>${i.name} × ${i.qty}</span><span>R${i.price * i.qty}</span></div>
    `).join('');
  }

  function renderPending() {
    document.getElementById('pendingCount').textContent = pending.length;
    const el = document.getElementById('pendingList');
    if (pending.length === 0) {
      el.innerHTML = `<div class="empty-state">No new orders right now. New orders will pop up here automatically.</div>`;
      return;
    }
    el.innerHTML = pending.map(order => `
      <div class="order-card pending">
        <div class="order-top">
          <div>
            <div class="order-name">${order.customer_name}</div>
            <div class="order-time">${fmtTime(order.created_at)}</div>
          </div>
          <span class="order-type-pill">${order.order_type}</span>
        </div>
        <div class="order-lines">${orderLinesHTML(order)}</div>
        ${order.order_type === 'Delivery' && order.address ? `<div class="order-address">📍 ${order.address}</div>` : ''}
        <div class="order-total"><span>Total</span><span>R${order.total}</span></div>
        <div class="order-actions">
          <button class="btn-reject" onclick="updateOrder('${order.id}', 'rejected')">Reject</button>
          <button class="btn-accept" onclick="updateOrder('${order.id}', 'confirmed')">Accept</button>
        </div>
      </div>
    `).join('');
  }

  function renderHistory() {
    const el = document.getElementById('historyList');
    if (history.length === 0) {
      el.innerHTML = `<div class="empty-state">Accepted and rejected orders will show up here.</div>`;
      return;
    }
    el.innerHTML = history.map(order => `
      <div class="order-card">
        <div class="order-top">
          <div>
            <div class="order-name">${order.customer_name}</div>
            <div class="order-time">${fmtTime(order.created_at)}</div>
          </div>
          <span class="status-pill ${order.status}">${order.status === 'confirmed' ? 'Accepted' : 'Rejected'}</span>
        </div>
        <div class="order-lines">${orderLinesHTML(order)}</div>
        <div class="order-total"><span>Total</span><span>R${order.total}</span></div>
      </div>
    `).join('');
  }

  async function updateOrder(id, status) {
    // Optimistic UI update
    pending = pending.filter(o => o.id !== id);
    renderPending();
    try {
      const { error } = await sb.from('orders').update({ status }).eq('id', id);
      if (error) throw error;
    } catch (err) {
      alert('Could not update this order — check your connection and try again.');
      loadOrders();
    }
  }
</script>

</body>
</html>
